[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pglt"
version = "0.1.0"
description = "Language-grounded continuous robot action representations and structured latent dynamics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "PyYAML>=6.0",
  "torch>=2.4",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/representation", "tests/dynamics"]
